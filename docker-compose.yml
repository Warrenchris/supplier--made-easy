version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supplier-made-easy
    ports:
      - "3000:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    volumes:
      - supplier_data:/app/server/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  supplier_data:
